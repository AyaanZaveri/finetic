appId: app.navigator.mobile
---
# Navigate within the app so iOS never opens a system confirmation dialog.
- launchApp:
    clearState: true
- tapOn:
    text: Wait
    optional: true
- extendedWaitUntil:
    visible: Settings
    timeout: 45000
- tapOn: Settings
- tapOn:
    id: open-playback-lab
- runFlow:
    when:
      true: ${ENGINE == 'aether'}
    commands:
      - tapOn:
          id: select-playback-engine-aether
- scrollUntilVisible:
    element:
      id: "playback-fixture-${FIXTURE}"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "playback-fixture-${FIXTURE}"
- scrollUntilVisible:
    element:
      id: "playback-engine-${ENGINE}"
    direction: UP
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: playback-player
    timeout: 45000
