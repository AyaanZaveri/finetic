appId: app.navigator.mobile
---
- scrollUntilVisible:
    element:
      id: detail-play
    direction: DOWN
    timeout: 15000
- tapOn:
    id: detail-play
    enabled: true
- extendedWaitUntil:
    visible:
      id: sign-in-stremio
    timeout: 15000
- assertVisible:
    id: sign-in-submit
- assertVisible:
    id: sign-in-sign-up
- assertNotVisible:
    id: sign-in-close
- assertNotVisible:
    id: sign-in-title
- assertNotVisible:
    id: stream-selector-title
- waitForAnimationToEnd:
    timeout: 1400
- takeScreenshot: sign-in-drawer
- tapOn:
    id: sign-in-email
- waitForAnimationToEnd:
    timeout: 1400
- assertVisible:
    id: sign-in-email
    focused: true
- takeScreenshot: sign-in-keyboard
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1400
- tapOn:
    point: '50%,12%'
- extendedWaitUntil:
    notVisible:
      id: sign-in-stremio
    timeout: 10000
- assertVisible:
    id: detail-play
