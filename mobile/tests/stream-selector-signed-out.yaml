appId: app.navigator.mobile
---
- scrollUntilVisible:
    element:
      id: detail-play
    direction: DOWN
    timeout: 15000
- tapOn:
    id: detail-play
    enabled: true
- extendedWaitUntil:
    visible:
      id: sign-in-stremio
    timeout: 25000
- assertVisible:
    id: sign-in-submit
- assertVisible:
    id: sign-in-sign-up
- assertNotVisible:
    id: sign-in-close
- assertNotVisible:
    id: sign-in-title
- assertNotVisible:
    id: stream-selector-title
- waitForAnimationToEnd:
    timeout: 1400
- takeScreenshot: sign-in-drawer
- tapOn:
    id: sign-in-email
- waitForAnimationToEnd:
    timeout: 1400
- assertVisible:
    id: sign-in-email
- takeScreenshot: sign-in-keyboard
# Dismiss the form and keyboard together. Maestro's generic hideKeyboard on
# iPad can tap the Sign up link where it expects the keyboard dismiss key.
- tapOn:
    point: '50%,8%'
- extendedWaitUntil:
    notVisible:
      id: sign-in-stremio
    timeout: 10000
- assertVisible:
    id: detail-play
