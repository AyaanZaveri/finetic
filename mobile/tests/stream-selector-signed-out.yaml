appId: app.navigator.mobile
---
- scrollUntilVisible:
    element:
      id: detail-play
    direction: DOWN
    timeout: 15000
- tapOn:
    id: detail-play
- extendedWaitUntil:
    visible:
      id: sign-in-title
    timeout: 15000
- assertVisible:
    id: sign-in-stremio
- assertVisible:
    id: sign-in-submit
- assertNotVisible:
    id: stream-selector-title
- waitForAnimationToEnd:
    timeout: 1400
- takeScreenshot: sign-in-drawer
- tapOn:
    id: sign-in-email
- waitForAnimationToEnd:
    timeout: 1400
- assertVisible:
    id: sign-in-close
- assertVisible:
    id: sign-in-email
    focused: true
- takeScreenshot: sign-in-keyboard
- tapOn:
    id: sign-in-close
- extendedWaitUntil:
    notVisible:
      id: sign-in-title
    timeout: 10000
- assertVisible:
    id: detail-play
