appId: app.navigator.mobile
---
# Run on the already-installed, fingerprint-matched development client.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ipad-home-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: hero-primary
- takeScreenshot: ipad-home-landscape
# Isolate the visual cases from touch-coordinate flakiness immediately after rotation.
- openLink: navigator-mobile:///movie/tt16311594
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ipad-title-landscape
- openLink: navigator-mobile:///search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- tapOn:
    id: search-input
- inputText: F1
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'media-card-movie:tt16311594'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-search-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-search-portrait
- openLink: navigator-mobile:///movie/tt16311594
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-movie-portrait
- assertNotVisible:
    id: tablet-detail-poster
- openLink: navigator-mobile:///series/tt22202452
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-series-landscape
- scrollUntilVisible:
    element:
      id: season-picker
    direction: DOWN
    timeout: 15000
- tapOn:
    id: season-picker
- extendedWaitUntil:
    visible:
      id: season-option-1
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-season-sheet
- tapOn:
    id: season-option-1
