appId: app.navigator.mobile
---
# Run on the already-installed, fingerprint-matched development client.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ipad-home-portrait
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: hero-primary
- takeScreenshot: ipad-home-landscape
# Navigate in portrait before rotating for the landscape capture. This avoids
# the external URL confirmation dialog and stale landscape touch coordinates.
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: hero-primary
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: ipad-title-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: title-detail-back
- tapOn: Search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- tapOn:
    id: search-input
- inputText: F1
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'media-card-movie:tt16311594'
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-search-landscape
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-search-portrait
- tapOn:
    id: 'media-card-movie:tt16311594'
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-movie-portrait
- assertNotVisible:
    id: tablet-detail-poster
- runFlow: stream-selector-signed-out.yaml
- tapOn:
    id: title-detail-back
- tapOn:
    id: search-clear
- tapOn:
    id: search-input
- inputText: Pluribus
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'media-card-series:tt22202452'
    timeout: 30000
- tapOn:
    id: 'media-card-series:tt22202452'
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-series-landscape
- scrollUntilVisible:
    element:
      id: season-picker
    direction: DOWN
    timeout: 15000
- tapOn:
    id: season-picker
- extendedWaitUntil:
    visible:
      id: season-option-1
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: ipad-season-sheet
- tapOn:
    id: season-option-1
