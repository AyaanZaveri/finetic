appId: app.navigator.mobile
---
# Recorder launches the app on Home in light appearance.
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 60000
- takeScreenshot: walkthrough-home-light
- swipe:
    start: '50%, 78%'
    end: '50%, 30%'
    duration: 800
- waitForAnimationToEnd:
    timeout: 1200
- swipe:
    start: '50%, 28%'
    end: '50%, 78%'
    duration: 800
- waitForAnimationToEnd:
    timeout: 1200
- swipe:
    start: '50%, 78%'
    end: '50%, 34%'
    duration: 800
- tapOn: Search
- assertVisible:
    id: search-input
- tapOn:
    id: search-input
- inputText: Pluribus
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'media-card-series:tt22202452'
    timeout: 30000
- takeScreenshot: walkthrough-search-pluribus
- tapOn:
    id: search-filter-series
- assertVisible:
    id: 'media-card-series:tt22202452'
- tapOn:
    id: 'media-card-series:tt22202452'
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: walkthrough-series-detail-light
- scrollUntilVisible:
    element:
      id: 'episode-card-1-1'
    direction: DOWN
    timeout: 25000
- takeScreenshot: walkthrough-episode-rail
- waitForAnimationToEnd:
    timeout: 1300
- swipe:
    from:
      id: 'episode-card-1-1'
      point: '85%, 45%'
    direction: LEFT
    duration: 800
- waitForAnimationToEnd:
    timeout: 1300
- swipe:
    from:
      id: 'episode-card-1-2'
      point: '20%, 45%'
    direction: RIGHT
    duration: 800
- extendedWaitUntil:
    visible:
      id: 'episode-card-1-1'
    timeout: 12000
- tapOn:
    id: season-picker
- extendedWaitUntil:
    visible:
      id: season-option-1
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: walkthrough-season-sheet
- tapOn:
    id: season-option-1
- extendedWaitUntil:
    notVisible:
      id: season-option-1
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: 'episode-card-1-1'
    timeout: 15000
- tapOn:
    id: 'episode-card-1-1'
- extendedWaitUntil:
    visible:
      id: episode-detail-name
    timeout: 30000
- takeScreenshot: walkthrough-episode-detail
- waitForAnimationToEnd:
    timeout: 1600
- tapOn:
    id: title-detail-back
- tapOn:
    id: title-detail-back
- tapOn: Settings
- tapOn:
    id: setting-appearance-dark
- waitForAnimationToEnd:
    timeout: 1600
- tapOn: Home
- scrollUntilVisible:
    element:
      id: hero-primary
    direction: UP
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1600
- scrollUntilVisible:
    element:
      text: Popular TV shows
    direction: DOWN
    timeout: 15000
- swipe:
    start: '50%, 76%'
    end: '50%, 22%'
    duration: 700
- waitForAnimationToEnd:
    timeout: 1200
- takeScreenshot: walkthrough-home-bottom
