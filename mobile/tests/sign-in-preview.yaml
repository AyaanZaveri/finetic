appId: app.navigator.mobile
---
# Use a catalog poster. It supplies a cached title summary, unlike a cold deep link.
- scrollUntilVisible:
    element:
      id: 'media-card-movie:tt.*'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'media-card-movie:tt.*'
    index: 0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 45000
- runFlow: stream-selector-signed-out.yaml
- tapOn:
    id: title-detail-back
- scrollUntilVisible:
    element:
      id: hero-primary
    direction: UP
    timeout: 15000
