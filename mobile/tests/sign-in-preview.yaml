appId: app.navigator.mobile
---
- tapOn:
    text: '^Open$'
    optional: true
- extendedWaitUntil:
    visible:
      id: title-detail-name
    timeout: 45000
- runFlow: stream-selector-signed-out.yaml
- tapOn:
    id: title-detail-back
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 30000
