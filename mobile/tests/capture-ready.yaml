appId: app.navigator.mobile
---
- tapOn:
    text: Open
    optional: true
- runFlow:
    when:
      visible: There was a problem loading the project.
    commands:
      - tapOn: Reload
- runFlow:
    when:
      visible: Catalogs are unavailable
    commands:
      - tapOn: Try again
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      # The disposable emulator's launcher, not Navigator, is stalled.
      - tapOn: Close app
- extendedWaitUntil:
    visible:
      id: ${TARGET_ID}
    timeout: 65000
- assertNotVisible: Uncaught Error
