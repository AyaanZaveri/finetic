appId: app.navigator.mobile
---
- tapOn:
    text: Open
    optional: true
- runFlow:
    when:
      visible: There was a problem loading the project.
    commands:
      - tapOn: Reload
- runFlow:
    when:
      visible: Catalogs are unavailable
    commands:
      - tapOn: Try again
- extendedWaitUntil:
    visible:
      id: ${TARGET_ID}
    timeout: 65000
- assertNotVisible: Uncaught Error
