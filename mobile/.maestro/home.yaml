appId: app.navigator.mobile
---
- launchApp:
    clearState: true
- tapOn:
    text: Wait
    optional: true
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 30000
- takeScreenshot: home-hero
- tapOn:
    id: hero-primary
- assertVisible:
    id: title-detail-page
- assertVisible: 'Wake Up Dead Man: A Knives Out Mystery'
- takeScreenshot: movie-detail
- tapOn:
    id: title-detail-back
- tapOn:
    id: hero-slide-1
- takeScreenshot: home-second-feature
- tapOn:
    id: hero-primary
- assertVisible:
    id: title-detail-page
- assertVisible: 'Pluribus'
- takeScreenshot: series-detail
- tapOn:
    id: title-detail-back
- scrollUntilVisible:
    element:
      id: 'media-card-movie:tmdb:812583'
    direction: DOWN
- swipe:
    direction: UP
    duration: 430
- takeScreenshot: home-cards
- scrollUntilVisible:
    element:
      id: 'media-card-movie:tmdb:812583'
    direction: UP
- tapOn:
    id: 'media-card-movie:tmdb:812583'
- assertVisible:
    id: title-detail-page
- tapOn:
    id: title-detail-back
- tapOn: Search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- tapOn:
    id: search-input
- inputText: Pluribus
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: 'media-card-series:tmdb:225171'
    timeout: 30000
- takeScreenshot: search
- tapOn:
    id: 'media-card-series:tmdb:225171'
- assertVisible:
    id: title-detail-page
- tapOn:
    id: title-detail-back
- tapOn: Settings
- assertVisible:
    id: settings-page
- takeScreenshot: settings
- tapOn: Home
- assertVisible:
    id: home-scroll
