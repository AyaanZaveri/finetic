appId: app.navigator.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: hero-primary
    timeout: 30000
- takeScreenshot: home-hero
- tapOn:
    id: hero-primary
- assertVisible:
    id: title-detail-page
- assertVisible: 'Wake Up Dead Man: A Knives Out Mystery'
- takeScreenshot: movie-detail
- tapOn:
    id: title-detail-back
- tapOn:
    id: hero-slide-1
- takeScreenshot: home-second-feature
- tapOn:
    id: hero-primary
- assertVisible:
    id: title-detail-page
- assertVisible: 'Pluribus'
- takeScreenshot: series-detail
- tapOn:
    id: title-detail-back
- scrollUntilVisible:
    element:
      id: 'media-card-movie:tmdb:812583'
    direction: DOWN
- swipe:
    direction: UP
    duration: 430
- takeScreenshot: home-cards
- scrollUntilVisible:
    element:
      id: 'media-card-movie:tmdb:812583'
    direction: UP
- longPressOn:
    id: 'media-card-movie:tmdb:812583'
- assertVisible:
    id: title-sheet
- takeScreenshot: home-quick-actions
- tapOn:
    id: quick-view-title
- assertVisible:
    id: title-detail-page
- tapOn:
    id: title-detail-back
