name: Check desktop startup and titlebar

on:
  push:
    branches: [desktop-startup-and-titlebar]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551
      - run: npm ci
      - name: Check restored cards and artwork
        run: |
          node scripts/test-continue-watching-cache.cjs
          node scripts/test-home-snapshot.cjs
          node scripts/test-home-row-streaming.cjs
          node scripts/test-artwork-reveal.cjs
      - name: Check the desktop bridge
        run: node scripts/test-desktop.cjs
      - name: Compile the native app and test the IPC protocol
        run: cargo test --manifest-path desktop/Cargo.toml --locked protocol::tests
