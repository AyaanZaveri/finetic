name: Expo mobile checks
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-expo.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-expo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expo-mobile-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
  android:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Configure Android SDK
        run: bash scripts/configure-android-sdk.sh
      - name: Build native Android app
        env:
          EXPO_PUBLIC_MOBILE_FIXTURES: '1'
        run: |
          mkdir -p test-results
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon | tee ../test-results/android-build.log
      - name: Start API 35 emulator
        run: |
          bash scripts/start-android-emulator.sh navigator-ci
          adb install -r android/app/build/outputs/apk/release/app-release.apk
      - name: Android component and interaction tests
        run: |
          mkdir -p test-results/phone test-results/large-text
          maestro test --format junit --output test-results/phone/report.xml --test-output-dir test-results/phone --debug-output test-results/phone .maestro
          adb shell settings put system font_scale 1.2
          maestro test --format junit --output test-results/large-text/report.xml --test-output-dir test-results/large-text --debug-output test-results/large-text .maestro
      - name: Collect Android diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test-results
          timeout 15 adb logcat -d -t 2000 > test-results/logcat.txt || true
          timeout 15 adb exec-out screencap -p > test-results/final-screen.png || rm -f test-results/final-screen.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-android-results
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
  ios:
    needs: foundation
    runs-on: macos-26
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Generate native iOS app
        run: |
          mkdir -p test-results
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install | tee ../test-results/pods.log
      - name: Build simulator app
        env:
          EXPO_PUBLIC_MOBILE_FIXTURES: '1'
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          xcodebuild -workspace "$workspace" -scheme Navigator -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/navigator-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee test-results/ios-build.log
      - name: iPhone and iPad component and interaction tests
        run: |
          app=$(find "$RUNNER_TEMP/navigator-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          for family in iPhone iPad; do
            folder="test-results/$family"
            mkdir -p "$folder"
            device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); family=sys.argv[1]; print(next(item["udid"] for runtime in reversed(list(d["devices"].values())) for item in runtime if item["name"].startswith(family)))' "$family")
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryLevel 100 || true
            xcrun simctl install "$device" "$app"
            result=0
            maestro test --device "$device" --format junit --output "$folder/report.xml" --test-output-dir "$folder" --debug-output "$folder" .maestro || result=$?
            xcrun simctl io "$device" screenshot "$folder/final-screen.png" || true
            xcrun simctl shutdown "$device" || true
            if [ "$result" -ne 0 ]; then exit "$result"; fi
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-ios-results
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
  android-preview:
    name: Android fast visual preview
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro and Expo Go
        run: |
          bash scripts/install-maestro.sh
          bash scripts/verify-download.sh https://github.com/expo/expo-go-releases/releases/download/Expo-Go-56.0.4/Expo-Go-56.0.4.apk "$RUNNER_TEMP/expo-go.apk" dd5eea2fb16ab83dd60b3d3767210702ecee3b67b4947e5e2367965e0d92a833
      - name: Configure Android SDK
        run: bash scripts/configure-android-sdk.sh
      - name: Start emulator and Metro
        run: |
          bash scripts/start-android-emulator.sh navigator-preview
          adb shell cmd uimode night yes
          adb install "$RUNNER_TEMP/expo-go.apk"
          bash scripts/start-preview-metro.sh
          adb reverse tcp:8081 tcp:8081
          adb shell am start -a android.intent.action.VIEW -d exp://127.0.0.1:8081 -p host.exp.exponent
      - name: Wait for first Android bundle
        run: bash scripts/wait-preview-bundle.sh Android
      - name: Capture preview screenshots
        run: maestro test -e APP_ID=host.exp.exponent --format junit --output test-results/report.xml --debug-output test-results --test-output-dir test-results .maestro-preview/home.yaml
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test-results
          timeout 15 adb logcat -d -t 2000 > test-results/logcat.txt || true
          timeout 15 adb exec-out screencap -p > test-results/final-screen.png || rm -f test-results/final-screen.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-android-preview
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
  ios-preview:
    name: iOS fast visual preview
    needs: foundation
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro and Expo Go
        run: |
          bash scripts/install-maestro.sh
          bash scripts/verify-download.sh https://github.com/expo/expo-go-releases/releases/download/Expo-Go-56.0.4/Expo-Go-56.0.4.tar.gz "$RUNNER_TEMP/expo-go.tar.gz" e6ed55f7ad9c31c81e819addcb79ed8f0cd629950517d84328e377f182104eed
          mkdir -p "$RUNNER_TEMP/expo-go/ExpoGo.app"
          tar -xzf "$RUNNER_TEMP/expo-go.tar.gz" -C "$RUNNER_TEMP/expo-go/ExpoGo.app"
      - name: Start iPhone simulator and Metro
        run: |
          mkdir -p test-results
          app="$RUNNER_TEMP/expo-go/ExpoGo.app"
          test -f "$app/Info.plist"
          app_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(item["udid"] for runtime in reversed(list(d["devices"].values())) for item in runtime if item["name"].startswith("iPhone")))')
          echo "PREVIEW_DEVICE=$device" >> "$GITHUB_ENV"
          echo "PREVIEW_APP_ID=$app_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark
          xcrun simctl install "$device" "$app"
          bash scripts/start-preview-metro.sh
          xcrun simctl openurl "$device" exp://127.0.0.1:8081
      - name: Wait for first iOS bundle
        run: bash scripts/wait-preview-bundle.sh iOS
      - name: Capture preview screenshots
        run: maestro test --device "$PREVIEW_DEVICE" -e APP_ID="$PREVIEW_APP_ID" --format junit --output test-results/report.xml --debug-output test-results --test-output-dir test-results .maestro-preview/home.yaml
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test-results
          if [ -n "${PREVIEW_DEVICE:-}" ]; then
            xcrun simctl io "$PREVIEW_DEVICE" screenshot test-results/final-screen.png
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-ios-preview
          path: mobile/test-results/
          if-no-files-found: ignore
          retention-days: 7
