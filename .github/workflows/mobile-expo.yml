name: Expo mobile checks
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-expo.yml'
  workflow_dispatch:
    inputs:
      device_packages:
        description: Build the test APK and unsigned IPA
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: expo-mobile-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  device_packages:
    if: github.event_name == 'workflow_dispatch' && inputs.device_packages
    uses: ./.github/workflows/mobile-device-packages.yml
  foundation:
    if: github.event_name != 'workflow_dispatch' || !inputs.device_packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
  android:
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Configure Android SDK
        run: bash scripts/configure-android-sdk.sh
      - name: Build native Android app
        run: |
          mkdir -p test-results
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon | tee ../test-results/android-build.log
      - name: Start API 35 emulator
        run: bash scripts/prepare-android-device.sh
      - name: Record native Android walkthrough
        id: android_walkthrough
        continue-on-error: true
        run: bash scripts/record-native-walkthrough.sh android test-results/walkthrough
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-walkthrough
          path: mobile/test-results/walkthrough/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture standalone Android screenshots
        id: android_capture
        continue-on-error: true
        run: bash scripts/capture-native-screens.sh android test-results/screens
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-screenshots
          path: mobile/test-results/screens/
          if-no-files-found: ignore
      - name: Android component and interaction tests
        run: |
          mkdir -p test-results/phone test-results/large-text
          result=0
          maestro test --format junit --output test-results/phone/report.xml --test-output-dir test-results/phone --debug-output test-results/phone .maestro || result=$?
          adb shell settings put system font_scale 1.2
          maestro test --format junit --output test-results/large-text/report.xml --test-output-dir test-results/large-text --debug-output test-results/large-text .maestro || result=$?
          exit "$result"
      - name: Collect Android diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p test-results
          free -m > test-results/host-memory.txt || true
          sudo dmesg | tail -100 > test-results/host-kernel.txt || true
          timeout 15 adb logcat -d -t 2000 > test-results/logcat.txt || true
          timeout 15 adb exec-out screencap -p > test-results/final-screen.png || rm -f test-results/final-screen.png
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-android-results
          path: |
            mobile/test-results/
            !mobile/test-results/walkthrough/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Check Android walkthrough and screenshot capture
        if: always() && (steps.android_capture.outcome == 'failure' || steps.android_walkthrough.outcome == 'failure')
        run: exit 1
  ios:
    needs: foundation
    runs-on: macos-26
    timeout-minutes: 65
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Generate native iOS app
        run: |
          mkdir -p test-results
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install | tee ../test-results/pods.log
      - name: Build simulator app
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          xcodebuild -workspace "$workspace" -scheme Navigator -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/navigator-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee test-results/ios-build.log
      - name: Locate built simulator app
        run: |
          app=$(find "$RUNNER_TEMP/navigator-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          echo "SIMULATOR_APP=$app" >> "$GITHUB_ENV"
      - name: Record native iPhone walkthrough
        id: iphone_walkthrough
        continue-on-error: true
        run: bash scripts/record-native-walkthrough.sh ios test-results/iPhone/walkthrough "$SIMULATOR_APP"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ios-walkthrough
          path: mobile/test-results/iPhone/walkthrough/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture standalone iPhone screenshots
        id: iphone_capture
        continue-on-error: true
        run: bash scripts/capture-native-screens.sh ios test-results/iPhone/screens iPhone "$SIMULATOR_APP"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ios-screenshots
          path: mobile/test-results/iPhone/screens/
          if-no-files-found: warn
      - name: Capture standalone iPad screenshots and verify tablet layout
        id: ipad_capture
        continue-on-error: true
        run: bash scripts/capture-native-screens.sh ios test-results/iPad/screens iPad "$SIMULATOR_APP"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ipad-screenshots
          path: mobile/test-results/iPad/screens/
          if-no-files-found: warn
      - name: iPhone and iPad component and interaction tests
        run: |
          app=$(find "$RUNNER_TEMP/navigator-ios/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          suite_result=0
          for family in iPhone iPad; do
            folder="test-results/$family"
            mkdir -p "$folder"
            device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); family=sys.argv[1]; print(next(item["udid"] for runtime in reversed(list(d["devices"].values())) for item in runtime if item["name"].startswith(family)))' "$family")
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
            xcrun simctl status_bar "$device" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryLevel 100 || true
            xcrun simctl install "$device" "$app"
            result=0
            maestro test --device "$device" --exclude-tags android-only --format junit --output "$folder/report.xml" --test-output-dir "$folder" --debug-output "$folder" .maestro || result=$?
            xcrun simctl io "$device" screenshot "$folder/final-screen.png" || true
            xcrun simctl shutdown "$device" || true
            if [ "$result" -ne 0 ]; then suite_result=$result; fi
          done
          exit "$suite_result"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: expo-ios-results
          path: |
            mobile/test-results/
            !mobile/test-results/iPhone/walkthrough/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Check iPhone walkthrough and iPad screenshot capture
        if: always() && (steps.iphone_capture.outcome == 'failure' || steps.ipad_capture.outcome == 'failure' || steps.iphone_walkthrough.outcome == 'failure')
        run: exit 1
