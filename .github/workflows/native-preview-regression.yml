name: Native preview container regression

on:
  workflow_dispatch:
  push:
    branches: [native-preview-regression]
    paths:
      - '.github/workflows/native-preview-regression.yml'
      - 'desktop/src/thumbnails.rs'
      - 'desktop/src/player.rs'
      - 'desktop/src/media_cache.rs'
      - 'desktop/src/preview_fallback.rs'
      - 'desktop/src/mpv.rs'
      - 'scripts/generate-native-preview-fixtures.py'
      - 'scripts/test-native-preview-long.py'
      - 'scripts/test-browser-preview-formats.mjs'
      - 'components/seek-preview.tsx'
      - 'lib/media/range-preview-frames.ts'
      - 'lib/media/preview-frames.ts'

permissions:
  contents: read

jobs:
  previews:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            library: desktop/vendor/windows-x86_64/libmpv-2.dll
          - os: macos-15
            library: desktop/vendor/macos-aarch64/libmpv.2.dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551
      - name: Download pinned playback libraries
        run: node scripts/fetch-desktop-libs.mjs
      - name: Install FFmpeg if needed (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Install FFmpeg if needed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall\bin" >> $env:GITHUB_PATH
          }
      - name: Generate matching synthetic media formats
        shell: bash
        run: python scripts/generate-native-preview-fixtures.py "$RUNNER_TEMP/preview-fixtures"
      - name: Resolve native paths for this runner
        shell: bash
        env:
          LIBMPV_PATH: ${{ matrix.library }}
        run: |
          node --input-type=module <<'JS'
          import { resolve, join } from 'node:path';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `NAVIGATOR_TEST_LIBMPV=${resolve(process.env.LIBMPV_PATH)}\nNAVIGATOR_TEST_PREVIEW_DIR=${join(process.env.RUNNER_TEMP, 'preview-fixtures')}\n`);
          JS
      - name: Exercise native index, decode, HTTP cache, and playback paths
        shell: bash
        env:
          RUST_LOG: warn
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked transient_index_reads_get_bounded_retries -- --nocapture
          cargo test --manifest-path desktop/Cargo.toml --locked full_preview_completes_a_range_when_sparse_read_would_yield -- --nocapture
          cargo test --manifest-path desktop/Cargo.toml --locked headless_webdl_preview_index_recovers_after_http_failure -- --ignored --nocapture
          failed=0
          for fixture in avc-stereo.mkv avc-surround-open-gop.mkv avc-front-cues.mkv hevc-control.mkv avc-no-cues.mkv avc-bad-cue-offsets.mkv avc-tail.mp4 avc-front.mp4 avc-fragmented.mp4 avc.mov vp9.webm; do
            # Each fixture has a fresh application/library lifetime. A native
            # crash cannot conceal the results for the remaining formats.
            NAVIGATOR_TEST_PREVIEW_FILE="$fixture" cargo test --manifest-path desktop/Cargo.toml --locked headless_webdl_preview_formats -- --ignored --nocapture || failed=1
          done
          python scripts/test-native-preview-long.py "$NAVIGATOR_TEST_PREVIEW_DIR" || failed=1
          exit "$failed"
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Check browser preview providers
        run: |
          node scripts/test-range-previews.cjs
          node scripts/test-previews.cjs
          node scripts/test-browser-preview-recovery.cjs
          node scripts/test-seek-preview-source.cjs
          node scripts/test-preview-images.cjs
          npx tsc --noEmit --incremental false
      - name: Install media and browser test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb
          npm install -g agent-browser@0.31.1
          google-chrome --version
      - name: Generate matching synthetic files
        run: python3 scripts/generate-native-preview-fixtures.py "$RUNNER_TEMP/preview-fixtures"
      - name: Decode and present real preview frames in Chrome
        run: xvfb-run -a node scripts/test-browser-preview-formats.mjs "$RUNNER_TEMP/preview-fixtures"
