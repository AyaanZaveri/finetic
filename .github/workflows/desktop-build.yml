name: Build desktop installers

# Manual only. Standard GitHub-hosted runners work in public forks without
# Blacksmith access, repository secrets, or the official release signing keys.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, macos, windows]
        default: all
        required: true
      delta_base_tag:
        description: Previous stable release for delta packages (empty selects latest)
        type: string
        default: ""
        required: false
      verify_windows_updates:
        description: Run signed Windows update fixtures after packaging (test assets only)
        type: boolean
        default: false
      windows_fixture_artifact_run:
        description: Reuse test installers from an earlier desktop build run
        type: string
        default: ""
      windows_fixture_source_run:
        description: Reuse the compiled fixture source from an earlier test run
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}-${{ inputs.platform }}-verify-${{ inputs.verify_windows_updates && github.sha || 'package' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  CARGO_BUILD_JOBS: "2"
  # Never try to use the upstream owner's private update-signing keys.
  NAVIGATOR_RELEASE_TAG: ""
  NAVIGATOR_UPDATE_SIGNING_KEY: ""
  NAVIGATOR_DELTA_BASE_TAG: ${{ inputs.delta_base_tag }}

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
      - name: Clear generated assets and verify version metadata
        run: node scripts/ci-desktop-artifacts.mjs prepare
      - run: npm ci
      - name: Check desktop and update behavior
        run: |
          node scripts/test-desktop.cjs
          node scripts/test-native-preview-cache.cjs
          node scripts/test-preview-images.cjs
          node scripts/test-range-previews.cjs
          node scripts/test-previews.cjs
          node scripts/test-browser-preview-recovery.cjs
          node scripts/test-seek-preview-source.cjs
          node scripts/test-preview-crop-worker.cjs
          node scripts/test-playback-wake-lock.cjs
          node scripts/test-surface-scrub.cjs
          node scripts/test-windows-install.cjs
          node scripts/test-windows-install-readiness.cjs
          npm run test:app-updates
          npm run test:navigator
          npm run test:people
          npm run test:search
          node scripts/test-button-drag.cjs
          node scripts/test-carousel-controls.cjs
          node scripts/test-media-card-menu.cjs
          node scripts/test-user-menu-keyboard.cjs
          node scripts/test-ci-desktop-artifacts.mjs
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Download verified playback libraries
        run: node scripts/fetch-desktop-libs.mjs
      - name: Prepare verified delta base
        run: node scripts/prepare-update-base.mjs macos
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build fresh frontend, native runtime and app archive
        run: npm run desktop:package
      - name: Verify packaged files and collect checksums
        run: node scripts/ci-desktop-artifacts.mjs collect
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Navigator-macOS-arm64-${{ github.sha }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    if: (inputs.platform == 'all' || inputs.platform == 'windows') && (inputs.verify_windows_updates || inputs.windows_fixture_artifact_run == '')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - name: Ensure NSIS is available
        if: inputs.windows_fixture_artifact_run == ''
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Clear generated assets and verify version metadata
        if: inputs.windows_fixture_artifact_run == ''
        run: node scripts/ci-desktop-artifacts.mjs prepare
      - run: npm ci
        if: inputs.windows_fixture_artifact_run == ''
      - name: Check desktop and update behavior
        if: inputs.windows_fixture_artifact_run == ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/test-desktop.cjs
          node scripts/test-native-preview-cache.cjs
          node scripts/test-preview-images.cjs
          node scripts/test-range-previews.cjs
          node scripts/test-previews.cjs
          node scripts/test-browser-preview-recovery.cjs
          node scripts/test-seek-preview-source.cjs
          node scripts/test-preview-crop-worker.cjs
          node scripts/test-playback-wake-lock.cjs
          node scripts/test-surface-scrub.cjs
          node scripts/test-windows-install.cjs
          node scripts/test-windows-install-readiness.cjs
          npm run test:app-updates
          npm run test:navigator
          npm run test:people
          npm run test:search
          node scripts/test-button-drag.cjs
          node scripts/test-carousel-controls.cjs
          node scripts/test-media-card-menu.cjs
          node scripts/test-user-menu-keyboard.cjs
          node scripts/test-ci-desktop-artifacts.mjs
          node scripts/test-windows-package.mjs
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Download verified playback libraries
        if: inputs.windows_fixture_artifact_run == ''
        run: node scripts/fetch-desktop-libs.mjs
      - name: Build the fixture source at its published version
        if: inputs.verify_windows_updates && inputs.windows_fixture_source_run == ''
        shell: pwsh
        run: node scripts/build-windows-native.mjs "$env:RUNNER_TEMP/navigator-fixture-source.exe"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.verify_windows_updates && inputs.windows_fixture_source_run == ''
        with:
          name: windows-update-source-${{ github.sha }}
          path: ${{ runner.temp }}/navigator-fixture-source.exe
          if-no-files-found: error
          retention-days: 1
      - name: Set the fixture target version
        if: inputs.verify_windows_updates && inputs.windows_fixture_artifact_run == ''
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm version 0.6.9 --no-git-tag-version --ignore-scripts
          @'
          const fs = require('node:fs');
          for (const name of ['Cargo.toml', 'Cargo.lock']) {
            const file = 'desktop/' + name;
            const version = /(name = "navigator-desktop"\r?\nversion = ")0\.6\.8(")/;
            const text = fs.readFileSync(file, 'utf8');
            if (!version.test(text)) throw Error('Unexpected fixture source version');
            fs.writeFileSync(file, text.replace(version, (_, start, end) => start + '0.6.9' + end));
          }
          '@ | node
      - name: Prepare verified delta base
        if: inputs.windows_fixture_artifact_run == ''
        run: node scripts/prepare-update-base.mjs windows
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build fresh frontend, native runtime and installers
        if: inputs.windows_fixture_artifact_run == ''
        run: npm run desktop:package
      - name: Verify packaged files and collect checksums
        if: inputs.windows_fixture_artifact_run == ''
        run: node scripts/ci-desktop-artifacts.mjs collect
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.windows_fixture_artifact_run == ''
        with:
          name: Navigator-Windows-x64-${{ github.sha }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows-verify-update:
    needs: windows
    if: inputs.verify_windows_updates
    runs-on: windows-2025
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        case: [legacy-delta, delta, fallback, full, recovery]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - name: Download the verified target installers and the test source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RUN: ${{ inputs.windows_fixture_artifact_run || github.run_id }}
          SOURCE_RUN: ${{ inputs.windows_fixture_source_run || github.run_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:FIXTURE_RUN -notmatch '^\d+$') { throw 'Invalid fixture run number.' }
          $run = gh run view $env:FIXTURE_RUN --json workflowName,headSha,jobs | ConvertFrom-Json
          if ($run.workflowName -ne 'Build desktop installers' -or $run.headSha -notmatch '^[a-f0-9]{40}$') {
            throw 'Select a build from the desktop installers workflow.'
          }
          $verified = $run.jobs | Where-Object Name -eq 'windows' |
            ForEach-Object Steps | Where-Object { $_.name -eq 'Verify packaged files and collect checksums' -and $_.conclusion -eq 'success' }
          if (!$verified) { throw 'The selected Windows build did not verify its packages.' }
          gh run download $env:FIXTURE_RUN --name "Navigator-Windows-x64-$($run.headSha)" --dir update-fixture
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid fixture source run number.' }
          $source = gh run view $env:SOURCE_RUN --json workflowName,headSha | ConvertFrom-Json
          if ($source.workflowName -ne 'Build desktop installers' -or $source.headSha -notmatch '^[a-f0-9]{40}$') {
            throw 'Select a source from the desktop installers workflow.'
          }
          gh run download $env:SOURCE_RUN --name "windows-update-source-$($source.headSha)" --dir update-fixture
          Push-Location update-fixture
          try {
            $checksums = @(Get-Content SHA256SUMS)
            foreach ($file in Get-ChildItem -File -Filter '*.exe' | Where-Object Name -like 'Navigator-*') {
              $digest = (Get-FileHash -LiteralPath $file.FullName).Hash
              if ("$digest  $($file.Name)" -notin $checksums) { throw "Fixture checksum mismatch: $($file.Name)" }
            }
          } finally {
            Pop-Location
          }
      - name: Exercise the installed updater
        shell: pwsh
        env:
          UPDATE_CASE: ${{ matrix.case }}
        run: |
          $target = (Resolve-Path update-fixture).Path
          ./scripts/verify-windows-restart-update.ps1 -SourceVersion '0.6.8' -TargetVersion '0.6.9' -Case $env:UPDATE_CASE -TargetDirectory $target -CandidateExecutable (Join-Path $target 'navigator-fixture-source.exe')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: windows-update-evidence-${{ matrix.case }}
          path: update-results/
          if-no-files-found: warn
          retention-days: 7
