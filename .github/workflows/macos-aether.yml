name: macOS Aether playback

on:
  push:
    branches: [macos-aether-playback]
  pull_request:
    branches: [main]
    paths:
      - 'desktop/macos/aether/**'
      - 'desktop/src/aether.rs'
      - 'desktop/src/protocol.rs'
      - 'scripts/package-aether.mjs'
      - '.github/workflows/macos-aether.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-aether-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Swift toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Generate and serve a real playback fixture
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          fixture="$RUNNER_TEMP/aether-fixture"
          mkdir -p "$fixture"
          printf '1\n00:00:01,000 --> 00:00:10,000\nNavigator playback fixture\n' > "$fixture/subtitles.srt"
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=18' -f lavfi -i 'sine=frequency=440:duration=18' -f lavfi -i 'sine=frequency=880:duration=18' -i "$fixture/subtitles.srt" -map 0:v -map 1:a -map 2:a -map 3:s -c:v libx264 -g 48 -pix_fmt yuv420p -c:a aac -c:s srt -metadata:s:a:0 language=eng -metadata:s:a:1 language=deu -metadata:s:s:0 language=eng "$fixture/fixture.mkv"
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=10' -f lavfi -i 'sine=frequency=440:duration=10' -c:v libx265 -preset ultrafast -vf 'format=yuv420p10le,setparams=color_primaries=bt2020:color_trc=smpte2084:colorspace=bt2020nc' -x265-params 'log-level=error:keyint=48:hdr10=1:repeat-headers=1:colorprim=bt2020:transfer=smpte2084:colormatrix=bt2020nc:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400' -c:a aac "$fixture/fixture-hdr.mkv"
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=10' -f lavfi -i 'sine=frequency=660:duration=10' -c:v libvpx-vp9 -deadline realtime -cpu-used 5 -g 48 -pix_fmt yuv420p -c:a aac "$fixture/fixture-vp9.mkv"
          printf ';FFMETADATA1\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=0\nEND=120000\ntitle=Opening\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=120000\nEND=150000\ntitle=Later chapter\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=150000\nEND=180000\ntitle=Final chapter\n' > "$fixture/chapters.ffmetadata"
          ffmpeg -v error -y -f lavfi -i 'testsrc2=size=320x180:rate=24:duration=180' -f lavfi -i 'sine=frequency=440:duration=180' -f ffmetadata -i "$fixture/chapters.ffmetadata" -map 0:v -map 1:a -map_chapters 2 -c:v libx264 -preset ultrafast -g 48 -pix_fmt yuv420p -c:a aac "$fixture/fixture-long.mkv"
          python3 scripts/aether-fixture-server.py "$fixture" 18765 > "$RUNNER_TEMP/aether-origin.log" 2>&1 &
          curl --fail --retry 8 --retry-connrefused --head http://127.0.0.1:18765/fixture.mkv
          echo "NAVIGATOR_AETHER_FIXTURE=http://127.0.0.1:18765/fixture.mkv" >> "$GITHUB_ENV"
      - name: Compile and test Aether bridge
        run: swift test --package-path desktop/macos/aether
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
      - name: Verify portable dynamic bridge bundle
        run: node scripts/package-aether.mjs "$RUNNER_TEMP/NavigatorAetherFixture.app/Contents" debug
  shell:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
      - name: Test Rust native shell
        run: cargo test --manifest-path desktop/Cargo.toml --locked
  frontend:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: node scripts/test-desktop.cjs
      - run: node scripts/test-native-preview-cache.cjs
      - run: node scripts/test-player-chapters.cjs
      - run: node scripts/test-native-subtitle-timing.cjs
      - run: npx tsc --noEmit --pretty false
