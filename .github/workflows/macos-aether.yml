name: macOS Aether playback

on:
  push:
    branches: [macos-aether-playback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-aether-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify Swift toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Compile and test Aether bridge
        run: swift test --package-path desktop/macos/aether
