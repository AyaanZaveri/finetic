name: Check player audio delay

on:
  push:
    branches: [audio-delay-loaded-session-check]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/player-audio-delay.yml
      - components/desktop/tracks.tsx
      - components/global-media-player.tsx
      - components/subtitle-timing-popover.tsx
      - desktop/src/bridge.js
      - desktop/src/player.rs
      - desktop/src/protocol.rs
      - lib/desktop/mpv-controller.ts
      - lib/media/subtitle-timing.ts
      - lib/media/use-audio-delay.ts
      - scripts/test-subtitle-timing.cjs
      - scripts/test-native-subtitle-timing.cjs

permissions:
  contents: read

jobs:
  audio-delay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            libmpv: desktop/vendor/macos-aarch64/libmpv.2.dylib
          - os: windows-2025
            libmpv: desktop/vendor/windows-x86_64/libmpv-2.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Check audio and subtitle timing controls
        run: |
          npm run test:player-settings
          node scripts/test-desktop.cjs
      - name: Check the web playback paths and types
        if: runner.os == 'Linux'
        run: |
          npm run test:webgpu
          npx tsc --noEmit --incremental false
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551
        if: matrix.libmpv != ''
        with:
          toolchain: 1.92.0
      - name: Compile and test native playback commands
        if: matrix.libmpv != ''
        run: cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Download pinned playback libraries
        if: matrix.libmpv != ''
        run: node scripts/fetch-desktop-libs.mjs
      - name: Verify the real mpv audio-delay property (no playback)
        if: matrix.libmpv != ''
        env:
          NAVIGATOR_TEST_LIBMPV: ${{ github.workspace }}/${{ matrix.libmpv }}
        run: cargo test --manifest-path desktop/Cargo.toml --locked audio_delay_ -- --ignored --nocapture
