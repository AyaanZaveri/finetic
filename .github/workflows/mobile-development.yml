name: Expo mobile visual previews
on:
  push:
    branches-ignore: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-development.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-development.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  # Metro binds to localhost. Android ADB reverse and readiness probes use IPv4.
  NODE_OPTIONS: '--dns-result-order=ipv4first'
  NO_PROXY: 'localhost,127.0.0.1'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
  android:
    # Queue each platform independently. A slow iOS build must not block a
    # cached Android preview (and vice versa). Preserve any cold-build cache.
    concurrency:
      group: expo-mobile-preview-android-${{ github.ref_name }}
      cancel-in-progress: false
    needs: foundation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Configure Android SDK
        run: bash scripts/configure-android-sdk.sh
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Compute native fingerprint
        id: fingerprint
        run: echo "hash=$(node scripts/dev-client-fingerprint.mjs android)" >> "$GITHUB_OUTPUT"
      - name: Restore matching development client
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-dev-client.sh android "${{ steps.fingerprint.outputs.hash }}"
      - name: Build development client on cache miss
        run: bash scripts/dev-client-android.sh build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.restore.outputs.hit != 'true'
        with:
          name: navigator-dev-android-${{ steps.fingerprint.outputs.hash }}
          path: mobile/test-results/dev-client/android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Launch current JavaScript in the native client
        run: bash scripts/dev-client-android.sh launch
      - name: Verify and capture Android sign-in
        run: bash scripts/capture-sign-in-preview.sh android
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-sign-in
          path: mobile/test-results/sign-in-*
          retention-days: 7
      - name: Capture Android Home in both appearances
        run: bash scripts/capture-hero-preview.sh android
        continue-on-error: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-hero-preview
          path: mobile/test-results/hero-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Record Android visual walkthrough and screenshots
        env:
          NAVIGATOR_DEV_CLIENT: '1'
        run: |
          if bash scripts/record-native-walkthrough.sh android test-results/dev-walkthrough; then exit 0; fi
          if [ "$(timeout 5 adb get-state 2>/dev/null || true)" = device ]; then exit 1; fi
          # A disconnected emulator is runner infrastructure, not an assertion
          # failure. Retry once with the same cached APK and Metro bundle.
          echo 'Android emulator disconnected; retrying once on a fresh emulator.'
          cp test-results/emulator.log test-results/emulator-first-attempt.log 2>/dev/null || true
          bash scripts/record-native-walkthrough.sh android test-results/dev-walkthrough-retry
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-dev-walkthrough
          path: |
            mobile/test-results/dev-walkthrough*/
            mobile/test-results/emulator*.log
            mobile/test-results/dev-client/metro.log
            mobile/test-results/dev-client/android-ready-*/
          if-no-files-found: warn
          retention-days: 7
  ios:
    # Queue each platform independently. A slow iOS build must not block a
    # cached Android preview (and vice versa). Preserve any cold-build cache.
    concurrency:
      group: expo-mobile-preview-ios-${{ github.ref_name }}
      cancel-in-progress: false
    needs: foundation
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Compute native fingerprint
        id: fingerprint
        run: echo "hash=$(node scripts/dev-client-fingerprint.mjs ios)" >> "$GITHUB_OUTPUT"
      - name: Restore matching development client
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-dev-client.sh ios "${{ steps.fingerprint.outputs.hash }}"
      - name: Build development client on cache miss
        run: bash scripts/dev-client-ios.sh build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.restore.outputs.hit != 'true'
        with:
          name: navigator-dev-ios-${{ steps.fingerprint.outputs.hash }}
          path: mobile/test-results/dev-client/ios-app.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Warm iOS Metro bundle
        run: bash scripts/warm-ios-metro.sh
      - name: Launch current JavaScript in the native client
        run: bash scripts/dev-client-ios.sh launch iPhone
      - name: Verify and capture iPhone sign-in
        run: bash scripts/capture-sign-in-preview.sh ios
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-iphone-sign-in
          path: mobile/test-results/sign-in-*
          retention-days: 7
      - name: Capture iPhone Home in both appearances
        run: bash scripts/capture-hero-preview.sh ios
        continue-on-error: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ios-hero-preview
          path: mobile/test-results/hero-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Record iPhone visual walkthrough and screenshots
        env:
          NAVIGATOR_DEV_CLIENT: '1'
        run: bash scripts/record-native-walkthrough.sh ios test-results/dev-walkthrough
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ios-dev-walkthrough
          path: |
            mobile/test-results/dev-walkthrough/
            mobile/test-results/dev-client/ios-metro.log
            mobile/test-results/dev-client/ios-ready-*/
            mobile/test-results/dev-client/ios-failed-ready.png
          if-no-files-found: warn
          retention-days: 7
  ipad:
    # An iPad uses the same universal iOS simulator binary. Never compile a
    # second one just for a different screen size. Run independently when cached.
    needs: foundation
    if: github.event_name != 'pull_request'
    concurrency:
      group: expo-mobile-preview-ipad-${{ github.ref_name }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Compute native fingerprint
        id: fingerprint
        run: echo "hash=$(node scripts/dev-client-fingerprint.mjs ios)" >> "$GITHUB_OUTPUT"
      - name: Restore universal iOS development client
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fingerprint="${{ steps.fingerprint.outputs.hash }}"
          bash scripts/restore-dev-client.sh ios "$fingerprint"
          if [ -s test-results/dev-client/ios-app.tar.gz ]; then exit 0; fi
          echo 'Waiting for the iPhone job to publish the matching universal client.'
          deadline=$((SECONDS + 2400))
          until [ "$SECONDS" -ge "$deadline" ]; do
            bash scripts/restore-dev-client.sh ios "$fingerprint" --allow-current-run
            if [ -s test-results/dev-client/ios-app.tar.gz ]; then exit 0; fi
            sleep 30
          done
          echo '::error::The iPhone job did not publish the matching universal client in time.'
          exit 1
      - name: Warm iPad Metro bundle
        if: steps.restore.outputs.hit == 'true'
        run: bash scripts/warm-ios-metro.sh
      - name: Launch current JavaScript on iPad
        if: steps.restore.outputs.hit == 'true'
        id: launch
        run: bash scripts/dev-client-ios.sh launch iPad
      - name: Verify and capture iPad sign-in
        if: steps.launch.outcome == 'success'
        run: |
          xcrun simctl ui "$DEV_CLIENT_IOS_DEVICE" appearance dark
          bash scripts/capture-sign-in-preview.sh ios
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.launch.outcome == 'success'
        with:
          name: navigator-ipad-sign-in
          path: mobile/test-results/sign-in-*
          retention-days: 7
      - name: Capture iPad Home in both appearances and orientations
        if: steps.launch.outcome == 'success'
        run: bash scripts/capture-hero-preview.sh ipad
        continue-on-error: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.restore.outputs.hit == 'true'
        with:
          name: navigator-ipad-hero-preview
          path: mobile/test-results/hero-preview/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture live portrait and landscape layouts
        if: steps.launch.outcome == 'success'
        run: |
          xcrun simctl ui "$DEV_CLIENT_IOS_DEVICE" appearance dark
          maestro test --device "$DEV_CLIENT_IOS_DEVICE" --test-output-dir test-results/ipad-preview --format junit --output test-results/ipad-report.xml tests/ipad-preview.yaml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always() && steps.restore.outputs.hit == 'true'
        with:
          name: navigator-ipad-dev-screenshots
          path: |
            mobile/test-results/ipad-preview/
            mobile/test-results/ipad-report.xml
            mobile/test-results/dev-client/ios-metro.log
            mobile/test-results/dev-client/ios-ready-*/
            mobile/test-results/dev-client/ios-failed-ready.png
          if-no-files-found: warn
          retention-days: 7
