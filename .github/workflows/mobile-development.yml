name: Expo mobile visual previews
on:
  push:
    branches-ignore: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-development.yml'
      - 'app/api/discovery/title/**'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-development.yml'
      - 'app/api/discovery/title/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
# Do not cancel a cold native-client build before it can publish its cache.
# GitHub keeps only the newest pending run for a branch.
concurrency:
  group: expo-mobile-preview-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: false
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  # Metro binds to localhost. Android ADB reverse and readiness probes use IPv4.
  NODE_OPTIONS: '--dns-result-order=ipv4first'
  NO_PROXY: 'localhost,127.0.0.1'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
  android:
    needs: foundation
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Configure Android SDK
        run: bash scripts/configure-android-sdk.sh
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Compute native fingerprint
        id: fingerprint
        run: echo "hash=$(node scripts/dev-client-fingerprint.mjs android)" >> "$GITHUB_OUTPUT"
      - name: Restore matching development client
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-dev-client.sh android "${{ steps.fingerprint.outputs.hash }}"
      - name: Build development client on cache miss
        run: bash scripts/dev-client-android.sh build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.restore.outputs.hit != 'true'
        with:
          name: navigator-dev-android-${{ steps.fingerprint.outputs.hash }}
          path: mobile/test-results/dev-client/android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Launch current JavaScript in the native client
        run: bash scripts/dev-client-android.sh launch
      - name: Record Android visual walkthrough and screenshots
        env:
          NAVIGATOR_DEV_CLIENT: '1'
        run: bash scripts/record-native-walkthrough.sh android test-results/dev-walkthrough
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-android-dev-walkthrough
          path: |
            mobile/test-results/dev-walkthrough/
            mobile/test-results/dev-client/metro.log
          if-no-files-found: warn
          retention-days: 7
  ios:
    needs: foundation
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install Maestro
        run: bash scripts/install-maestro.sh
      - name: Compute native fingerprint
        id: fingerprint
        run: echo "hash=$(node scripts/dev-client-fingerprint.mjs ios)" >> "$GITHUB_OUTPUT"
      - name: Restore matching development client
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/restore-dev-client.sh ios "${{ steps.fingerprint.outputs.hash }}"
      - name: Build development client on cache miss
        run: bash scripts/dev-client-ios.sh build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.restore.outputs.hit != 'true'
        with:
          name: navigator-dev-ios-${{ steps.fingerprint.outputs.hash }}
          path: mobile/test-results/dev-client/ios-app.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Launch current JavaScript in the native client
        run: bash scripts/dev-client-ios.sh launch iPhone
      - name: Record iPhone visual walkthrough and screenshots
        env:
          NAVIGATOR_DEV_CLIENT: '1'
        run: bash scripts/record-native-walkthrough.sh ios test-results/dev-walkthrough
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: navigator-ios-dev-walkthrough
          path: |
            mobile/test-results/dev-walkthrough/
            mobile/test-results/dev-client/ios-metro.log
          if-no-files-found: warn
          retention-days: 7
