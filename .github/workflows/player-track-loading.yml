name: Check player track loading

on:
  push:
    branches: [player-track-loading]
  pull_request:
    paths:
      - components/global-media-player.tsx
      - components/desktop/tracks.tsx
      - lib/desktop/mpv-controller.ts
      - lib/media/browser-audio-switch.ts
      - scripts/test-native-track-loading.cjs
      - scripts/test-playback-preferences.cjs
      - scripts/test-player-settings.cjs
      - .github/workflows/player-track-loading.yml

permissions:
  contents: read

jobs:
  track-loading:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - run: node scripts/test-native-track-loading.cjs
      - run: node scripts/test-playback-preferences.cjs
      - run: node scripts/test-player-subtitles.cjs
      - run: node scripts/test-player-settings.cjs
      - name: Check WebGPU audio and the browser runtime
        if: runner.os == 'Linux'
        run: |
          npm run prepare:webgpu
          node scripts/test-webgpu-player.cjs
