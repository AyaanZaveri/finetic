name: Verify artwork reveals in browsers

on:
  push:
    branches: [artwork-reveal-browser-tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-2025
            browser: chromium
          - os: macos-15
            browser: chromium
          - os: macos-15
            browser: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ARTWORK_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci
      - name: Install browser test driver
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/reveal-test" --no-save playwright@1.65.1
          echo "PLAYWRIGHT_ENTRY=$RUNNER_TEMP/reveal-test/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          if [ "$ARTWORK_BROWSER" = webkit ]; then
            node "$RUNNER_TEMP/reveal-test/node_modules/playwright/cli.js" install webkit
          fi
      - name: Measure the current main implementation before the fix
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARTWORK_CAPTURE_DIR: artwork-before
          ARTWORK_EXPECT_BASELINE: '1'
        run: |
          git restore --source=e85167b -- components/media-card.tsx components/media-card.module.css components/home-continue-watching.tsx
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > artwork-before-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; git restore --source=HEAD -- components/media-card.tsx components/media-card.module.css components/home-continue-watching.tsx' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 2 --max-time 100 --output /dev/null http://127.0.0.1:3000/states/artwork-reveal
          node scripts/verify-artwork-reveal-browser.mjs
      - name: Run actual card reveal and frame sampling
        shell: bash
        run: |
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3000 > artwork-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 30 --retry-connrefused --retry-delay 2 --max-time 100 --output /dev/null http://127.0.0.1:3000/states/artwork-reveal
          node scripts/verify-artwork-reveal-browser.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: artwork-reveal-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            artwork-server.log
            artwork-before-server.log
            artwork-before/
            artwork-browser-captures/
          retention-days: 3
