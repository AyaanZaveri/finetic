name: Measure native Windows track switching

on:
  push:
    branches: [windows-workbench-verification]
    paths:
      - .github/workflows/windows-track-switch.yml
      - desktop/src/player.rs
      - desktop/src/track_switch_probe.rs

permissions:
  contents: read

jobs:
  track-switch:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      NAVIGATOR_TEST_TRACK_URL: https://raw.githubusercontent.com/ietf-wg-cellar/matroska-test-files/e6965e5ca666322ed93e2748a10a4f132309e005/test_files/test5.mkv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26.7.0
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - name: Download pinned playback library and fixture
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/fetch-desktop-libs.mjs
          $sample = Join-Path $env:RUNNER_TEMP 'elephant-dreams-test5.mkv'
          curl.exe --fail --silent --show-error --location --retry 3 --output $sample $env:NAVIGATOR_TEST_TRACK_URL
          $expected = '92acdc33bb0b5d7a4d9b0d6ca792230a78c786a30179dc9999cee41c28642842'
          if ((Get-FileHash -Algorithm SHA256 $sample).Hash -ne $expected) { throw 'MKV checksum mismatch' }
          "NAVIGATOR_TEST_TRACK_SAMPLE=$sample" >> $env:GITHUB_ENV
          $mpv = Resolve-Path 'desktop/vendor/windows-x86_64/libmpv-2.dll'
          "NAVIGATOR_TEST_LIBMPV=$mpv" >> $env:GITHUB_ENV
      - name: Measure the playback clock during actual track changes
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --manifest-path desktop/Cargo.toml --locked headless_track_switch_clock -- --ignored --nocapture
